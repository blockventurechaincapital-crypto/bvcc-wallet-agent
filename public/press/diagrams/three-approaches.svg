<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" font-family="Inter, system-ui, sans-serif">
  <title>Three ways to let an AI agent spend money</title>
  <desc>Comparing a raw private key, an off-chain signing server, and on-chain limits enforced by the wallet contract.</desc>

  <rect width="1200" height="560" fill="#06080f"/>

  <text x="48" y="52" fill="#d4af37" font-family="'IBM Plex Mono', monospace" font-size="13" letter-spacing="2.4">
    THREE WAYS TO LET AN AI AGENT SPEND MONEY
  </text>
  <text x="48" y="82" fill="#8892a4" font-size="15">
    The question is always the same: when the agent misbehaves, what stops it, and who do you have to trust?
  </text>

  <!-- ── Column 1: raw key ── -->
  <g>
    <rect x="48" y="116" width="352" height="366" rx="14" fill="#0d1117" stroke="rgba(252,129,129,.28)"/>
    <text x="76" y="152" fill="#fc8181" font-family="'IBM Plex Mono', monospace" font-size="11" letter-spacing="1.6">APPROACH 01</text>
    <text x="76" y="184" fill="#f0f4f8" font-size="20" font-weight="700">Give it a private key</text>
    <text x="76" y="212" fill="#8892a4" font-size="13.5">What almost everyone does today.</text>

    <line x1="76" y1="234" x2="372" y2="234" stroke="rgba(255,255,255,.07)"/>

    <text x="76" y="264" fill="#8892a4" font-size="12" font-family="'IBM Plex Mono', monospace">WHAT STOPS IT</text>
    <text x="76" y="290" fill="#fc8181" font-size="15" font-weight="600">Nothing</text>

    <text x="76" y="326" fill="#8892a4" font-size="12" font-family="'IBM Plex Mono', monospace">YOU TRUST</text>
    <text x="76" y="352" fill="#f0f4f8" font-size="15">The model, every prompt it reads,</text>
    <text x="76" y="374" fill="#f0f4f8" font-size="15">and every file the key sits in</text>

    <text x="76" y="414" fill="#8892a4" font-size="12" font-family="'IBM Plex Mono', monospace">BLAST RADIUS</text>
    <text x="76" y="440" fill="#fc8181" font-size="15" font-weight="600">The entire wallet</text>
  </g>

  <!-- ── Column 2: server ── -->
  <g>
    <rect x="424" y="116" width="352" height="366" rx="14" fill="#0d1117" stroke="rgba(255,255,255,.1)"/>
    <text x="452" y="152" fill="#8892a4" font-family="'IBM Plex Mono', monospace" font-size="11" letter-spacing="1.6">APPROACH 02</text>
    <text x="452" y="184" fill="#f0f4f8" font-size="20" font-weight="700">Put a server in front</text>
    <text x="452" y="212" fill="#8892a4" font-size="13.5">A policy engine signs on your behalf.</text>

    <line x1="452" y1="234" x2="748" y2="234" stroke="rgba(255,255,255,.07)"/>

    <text x="452" y="264" fill="#8892a4" font-size="12" font-family="'IBM Plex Mono', monospace">WHAT STOPS IT</text>
    <text x="452" y="290" fill="#f0f4f8" font-size="15" font-weight="600">Someone else’s code</text>

    <text x="452" y="326" fill="#8892a4" font-size="12" font-family="'IBM Plex Mono', monospace">YOU TRUST</text>
    <text x="452" y="352" fill="#f0f4f8" font-size="15">Whoever runs the server, plus</text>
    <text x="452" y="374" fill="#f0f4f8" font-size="15">their uptime and their breaches</text>

    <text x="452" y="414" fill="#8892a4" font-size="12" font-family="'IBM Plex Mono', monospace">BLAST RADIUS</text>
    <text x="452" y="440" fill="#f0f4f8" font-size="15" font-weight="600">Whatever the server will sign</text>
  </g>

  <!-- ── Column 3: contract ── -->
  <g>
    <rect x="800" y="116" width="352" height="366" rx="14" fill="#0b0e16" stroke="rgba(212,175,55,.35)"/>
    <rect x="800" y="116" width="352" height="366" rx="14" fill="rgba(212,175,55,.03)"/>
    <text x="828" y="152" fill="#d4af37" font-family="'IBM Plex Mono', monospace" font-size="11" letter-spacing="1.6">APPROACH 03 · BVCC</text>
    <text x="828" y="184" fill="#f0f4f8" font-size="20" font-weight="700">Put limits in the contract</text>
    <text x="828" y="212" fill="#8892a4" font-size="13.5">The agent signs freely. The wallet refuses.</text>

    <line x1="828" y1="234" x2="1124" y2="234" stroke="rgba(212,175,55,.16)"/>

    <text x="828" y="264" fill="#8892a4" font-size="12" font-family="'IBM Plex Mono', monospace">WHAT STOPS IT</text>
    <text x="828" y="290" fill="#22c55e" font-size="15" font-weight="600">The chain, on every call</text>

    <text x="828" y="326" fill="#8892a4" font-size="12" font-family="'IBM Plex Mono', monospace">YOU TRUST</text>
    <text x="828" y="352" fill="#f0f4f8" font-size="15">The contract, which is open</text>
    <text x="828" y="374" fill="#f0f4f8" font-size="15">source and verified on 6 chains</text>

    <text x="828" y="414" fill="#8892a4" font-size="12" font-family="'IBM Plex Mono', monospace">BLAST RADIUS</text>
    <text x="828" y="440" fill="#f5d76e" font-size="15" font-weight="600">The remaining budget</text>
  </g>

  <text x="48" y="522" fill="#4a5568" font-size="12.5">
    BVCC Agent Wallet · bvccwallet.blockventurechaincapital.com · Public beta, internally reviewed, not externally audited
  </text>
</svg>
